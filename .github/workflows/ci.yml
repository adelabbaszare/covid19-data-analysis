name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show code-quality tool versions
        run: |
          python -m black --version
          python -m isort --version-number
          python -m ruff --version

      - name: Show Black formatting diff
        run: python -m black --diff src tests

      - name: Check formatting
        run: python -m black --check src tests

      - name: Check import ordering
        run: python -m isort --check-only src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest -q
